  <!-- Firebase SDK (Modular v10+) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot, 
      query, 
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // VOS VRAIES CLÉS FIREBASE INTÉGRÉES
    const firebaseConfig = {
      apiKey: "AIzaSyDFEn2_Vl6-_GSggJgu5oA-HR60Sv-0qTw",
      authDomain: "racetracker-e5078.firebaseapp.com",
      projectId: "racetracker-e5078",
      storageBucket: "racetracker-e5078.firebasestorage.app",
      messagingSenderId: "31746007698",
      appId: "1:31746007698:web:bc1a07e20942fcf8d0bc4b"
    };

    // Initialisation Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Export vers la portée globale
    window.fbAuth = auth;
    window.fbDb = db;
    window.fbMethods = {
      signInWithPopup,
      GoogleAuthProvider,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      collection,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot,
      query,
      where
    };
  </script>
