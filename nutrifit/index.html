<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriFit Triathlon - Planning Nolio & Nutrition Adaptative</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { background-color: #3b82f6 !important; color: white !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .calendar-day-today { border: 2px solid #3b82f6 !important; background-color: rgba(59, 130, 246, 0.15); }
    </style>
</head>
<body class="h-full font-sans antialiased bg-slate-900 text-slate-100 flex flex-col md:flex-row pb-16 md:pb-0">

    <!-- Navigation Latérale (Desktop) -->
    <aside class="w-full md:w-64 bg-slate-800 border-r border-slate-700 flex-shrink-0 flex flex-col justify-between p-4 hidden md:flex">
        <div>
            <div class="flex items-center gap-3 px-2 py-4 mb-6 border-b border-slate-700">
                <i class="fa-solid fa-person-triathlon text-3xl text-blue-500"></i>
                <div>
                    <h1 class="font-bold text-lg tracking-wide text-white">NutriFit Tri</h1>
                    <p class="text-xs text-blue-400 font-medium" id="side-objective-badge">Planning 28 Jours / Nolio</p>
                </div>
            </div>

            <nav class="space-y-1">
                <button onclick="switchTab('calendar')" id="btn-calendar" class="nav-btn active-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-calendar-days w-5"></i> Calendrier Nolio
                </button>
                <button onclick="switchTab('recipes')" id="btn-recipes" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-utensils w-5"></i> Menus du Jour
                </button>
                <button onclick="switchTab('profile')" id="btn-profile" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-user-gear w-5"></i> Profil & Métabolisme
                </button>
                <button onclick="switchTab('progress')" id="btn-progress" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-weight-scale w-5"></i> Suivi & Poids
                </button>
                <button onclick="switchTab('groceries')" id="btn-groceries" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-cart-shopping w-5"></i> Liste de Courses
                </button>
            </nav>
        </div>

        <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-700/50 text-xs text-slate-400 space-y-1">
            <div class="flex justify-between">
                <span>Poids Actuel :</span>
                <span class="text-white font-medium" id="sidebar-weight-display">78.5 kg</span>
            </div>
            <div class="flex justify-between">
                <span>Métabolisme de Base :</span>
                <span class="text-blue-400 font-medium" id="sidebar-bmr-display">1750 kcal</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">

        <!-- TAB CALENDRIER NOLIO -->
        <section id="tab-calendar" class="space-y-6">
            <!-- Header & Import CSV -->
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <div>
                    <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-calendar-check text-blue-500"></i> Planning Entraînement (4 Semaines)
                    </h2>
                    <p class="text-slate-400 text-sm mt-1">Aujourd'hui : <span id="today-date-banner" class="text-blue-400 font-bold">--</span></p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <label class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition cursor-pointer flex items-center gap-2 shadow-lg">
                        <i class="fa-solid fa-file-csv"></i> Importer CSV Nolio
                        <input type="file" id="nolio-csv-input" accept=".csv,.txt" class="hidden" onchange="handleNolioCSVImport(event)">
                    </label>
                    <button onclick="resetToDefaultProgram()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2.5 rounded-xl text-xs font-medium transition">
                        Réinitialiser
                    </button>
                </div>
            </div>

            <!-- Notice Import -->
            <div id="import-notification" class="hidden p-4 bg-emerald-900/40 border border-emerald-5
