<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriFit Triathlon - Estimateur & Nutrition Adaptative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { background-color: #3b82f6 !important; color: white !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="h-full font-sans antialiased bg-slate-900 text-slate-100 flex flex-col md:flex-row pb-16 md:pb-0">

    <!-- Navigation Latérale (Desktop) -->
    <aside class="w-full md:w-64 bg-slate-800 border-r border-slate-700 flex-shrink-0 flex flex-col justify-between p-4 hidden md:flex">
        <div>
            <div class="flex items-center gap-3 px-2 py-4 mb-6 border-b border-slate-700">
                <i class="fa-solid fa-person-triathlon text-3xl text-blue-500"></i>
                <div>
                    <h1 class="font-bold text-lg tracking-wide text-white">NutriFit Tri</h1>
                    <p class="text-xs text-blue-400 font-medium" id="side-objective-badge">Objectif -10kg / 1 An</p>
                </div>
            </div>

            <nav class="space-y-1">
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn active-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-chart-pie w-5"></i> Tableau de bord
                </button>
                <button onclick="switchTab('profile')" id="btn-profile" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-user-gear w-5"></i> Profil & Objectifs
                </button>
                <button onclick="switchTab('training')" id="btn-training" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-calculator w-5"></i> Estimateur & Planning
                </button>
                <button onclick="switchTab('recipes')" id="btn-recipes" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-utensils w-5"></i> Menus & Recettes
                </button>
                <button onclick="switchTab('progress')" id="btn-progress" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-weight-scale w-5"></i> Suivi & Poids
                </button>
                <button onclick="switchTab('groceries')" id="btn-groceries" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition text-left text-slate-300 hover:bg-slate-700">
                    <i class="fa-solid fa-cart-shopping w-5"></i> Liste de Courses
                </button>
            </nav>
        </div>

        <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-700/50 text-xs text-slate-400">
            <div class="flex justify-between mb-1">
                <span>Poids :</span>
                <span class="text-white font-medium" id="sidebar-weight-display">78.5 kg</span>
            </div>
            <div class="flex justify-between">
                <span>Métabolisme de Base :</span>
                <span class="text-blue-400 font-medium" id="sidebar-bmr-display">1750 kcal</span>
            </div>
        </div>
    </aside>

    <!-- Main Container -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">

        <!-- DASHBOARD TAB -->
        <section id="tab-dashboard" class="space-y-6">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800 p-6 rounded-2xl border border-slate-700">
                <div>
                    <h2 class="text-2xl font-bold text-white">Aujourd'hui : <span id="current-date-display" class="text-blue-400">Jour 1</span></h2>
                    <p class="text-slate-400 text-sm">Entraînement prévu : <span id="dash-workout" class="text-white font-medium">Natation (45 min)</span></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="switchTab('recipes')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl font
